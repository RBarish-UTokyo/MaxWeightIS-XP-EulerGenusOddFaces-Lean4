fidelity:
  divergences: >-
    (1) Surfaces are finite combinatorial flag maps, and the drawing is given
    together with a witness that it is a subdrawing of a cellular map of the
    surface; the ambient map is a proof witness only and does not enter the
    input size. (2) N = |V| + |E| + 1 counts the drawing (the manuscript's
    N also counts faces; this changes N by a constant factor). (3) The
    machine is an explicit sixteen-register pointer machine with a
    logarithmic bit-cost measure including the explicit stack cost of calls;
    the input is a fixed binary encoding with common widths. (4) The kernel
    complement W is computed from incidence-kernel generators by cycle
    decomposition and greedy rank-increasing selection, not from an odd
    unicycle; its rows have entries of absolute value at most two and its
    number of rows is the dimension of Lemma 6. (5) Half-integrality and
    persistence are proved via the max-flow construction rather than the
    extreme-point argument.

review:
  status: "reviewed by the author"
  reviewers:
    - "Robert D. Barish"
  notes: >-
    The author reviewed the formalization and its statement. The proof is
    checked by the Lean kernel, and Comparator verifies that the solution
    proves the challenge statement using only the permitted axioms.

alignment:
  namespace: "WeightedMIS"
  statements:
    - source: "Theorem 1 (with its noncellular, disconnected and orientable extensions)"
      lean: "WeightedMIS.Spec.main_claim"
      module: "Solution"
      status: proved
      note: >-
        Statement WeightedMIS.Spec.MainClaim (WeightedMIS/Statement.lean);
        proof WeightedMIS.MainTheorem.mainClaim_of_program applied to the
        concrete table WeightedMIS.FinalProgram.program.
    - source: "Lemmas 3-5, 8-10 and the recovery argument (correctness of the algorithm)"
      lean: "WeightedMIS.ExecutableMIS.solve_correct"
      module: "WeightedMIS.ExecutableMIS"
      status: proved
      note: "The executable solver returns a maximum-weight independent set for arbitrary rational weights."
    - source: "Lemmas 2, 6, 7 and 11 (parameter bound on computed components)"
      lean: "WeightedMIS.ComputedDrawing.solve_correct_and_parameters"
      module: "WeightedMIS.ComputedDrawingParameters"
      status: proved
      note: "Actual computed dimensions are at most D(gamma, k), and at most the orientable exponent on orientable surfaces."

acknowledgements: >-
  Mathlib and the Lean community; the Lean toolchain's lake comparator and
  independent kernels.
